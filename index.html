<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d9d3cd">
<title>Барельеф Бук — контакты</title>
<meta name="description" content="Барельефы и гипсовые 3D картины. Контакты: Instagram, Telegram, телефон.">
<style>
  :root {
    /* какую часть фотки показывать на узких экранах: 0% = левый край, 100% = правый */
    --bg-x: 60%;
    --ink: #2a2521;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #cfc8c1;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #fff;
    -webkit-tap-highlight-color: transparent;
  }

  .screen {
    position: relative;
    max-width: 480px;
    margin: 0 auto;
    height: 100vh;
    height: 100dvh;
    min-height: 560px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding:
      max(clamp(28px, 7vh, 64px), env(safe-area-inset-top))
      16px
      max(20px, env(safe-area-inset-bottom));
    background: #d9d3cd url("bg.jpg") var(--bg-x) 50% / cover no-repeat;
    overflow: hidden;
  }

  .head { text-align: center; color: var(--ink); }
  .title {
    font-weight: 600;
    font-size: clamp(30px, 9vw, 40px);
    line-height: 1.1;
    letter-spacing: -.01em;
  }
  .sub {
    margin: 8px auto 0;
    max-width: 22em;
    font-size: clamp(13px, 3.9vw, 16px);
    letter-spacing: .03em;
    opacity: .78;
    text-wrap: balance;
  }

  .links {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-width: 0;
    min-height: clamp(42px, 5.6vh, 50px);
    padding: 0 10px;
    border-radius: 16px;
    color: #fff;
    text-decoration: none;
    font-size: clamp(13px, 3.7vw, 16px);
    font-weight: 500;
    white-space: nowrap;

    border: 1px solid rgba(255, 255, 255, 0.20);
    background:
      linear-gradient(0deg, rgba(0, 0, 0, 0.30) 0%, rgba(0, 0, 0, 0.30) 100%),
      linear-gradient(203deg, rgba(255, 255, 255, 0.21) 0.06%, rgba(255, 255, 255, 0.49) 97.58%);
    -webkit-backdrop-filter: blur(15.55px);
    backdrop-filter: blur(15.55px);

    transition: transform .15s ease, filter .15s ease;
  }
  .btn.wide { grid-column: 1 / -1; }
  .btn:active { transform: scale(.98); filter: brightness(1.12); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .btn svg {
    width: 20px;
    height: 20px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.7;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  @media (max-width: 340px) {
    .btn { padding: 0 8px; gap: 6px; }
    .btn svg { width: 18px; height: 18px; }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .head, .btn { animation: rise .6s ease both; }
    .btn { animation-delay: calc(.12s + var(--i, 0) * .07s); }
  }
</style>
</head>
<body>
  <main class="screen">
    <header class="head">
      <h1 class="title">Барельеф Бук</h1>
      <p class="sub">Барельефы и гипсовые 3D картины</p>
    </header>

    <nav class="links" aria-label="Контакты">
      <a class="btn" style="--i:0" href="https://www.instagram.com/barelef_buk?vrfl=ZW9hOHlndHE1bzNm" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></svg>
        Instagram
      </a>
      <a class="btn" style="--i:1" href="https://t.me/BarelefBuk" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l5.5 2L19 6.5 10 14.2V19l2.8-2.7 4.4 3.2L21 4Z"/></svg>
        Telegram-канал
      </a>
      <a class="btn wide" style="--i:2" href="https://t.me/Barelef_buk" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 4 3 11l5.5 2L19 6.5 10 14.2V19l2.8-2.7 4.4 3.2L21 4Z"/></svg>
        Написать: @Barelef_buk
      </a>
      <a class="btn wide" style="--i:3" href="tel:+79289519811">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
        +7 (928) 951-98-11
      </a>
      <a class="btn wide" style="--i:4" href="tel:+79283272083">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92Z"/></svg>
        +7 (928) 327-20-83
      </a>
    </nav>
  </main>
</body>
</html>
